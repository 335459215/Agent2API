name: Sync from upstream

# 两分支模型：
#   main —— 上游镜像。内容与 aimod-cc/Agent2API 的 main 完全一致（同一 SHA），
#           不带任何本地改动。由本任务强制对齐。
#   dev  —— 全部本地改动所在分支（打包脚本、构建钩子、面板精简等）。本任务把 dev
#           rebase 到新的 main 之上，本地提交永远在顶部。
#
# 为什么默认分支是 dev：GitHub 的 schedule 只在**默认分支**上读取 workflow。同步
# 脚本本身是本地新增文件，放进 main 就会让 main 不再是纯上游，所以脚本住在 dev。
#
# 冲突时中止并报错，不强推、不留半成品。手动解一次冲突后恢复自动同步。

on:
  schedule:
    # 每 6 小时一次，错开整点
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream:
        description: "上游仓库（owner/repo）"
        required: false
        default: "aimod-cc/Agent2API"
      upstream_branch:
        description: "上游分支"
        required: false
        default: "main"

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          # 用 PAT 而不是 GITHUB_TOKEN：内置 token **永远**没有 workflow 权限，
          # 上游一改 .github/workflows/* 就会被拒：
          #   refusing to allow a GitHub App to create or update workflow
          #   `…/frontend-artifacts.yml` without `workflows` permission
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Mirror upstream into main
        env:
          UPSTREAM: ${{ inputs.upstream || 'aimod-cc/Agent2API' }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --no-tags --prune upstream "+refs/heads/*:refs/remotes/upstream/*"

          SRC="refs/remotes/upstream/${UPSTREAM_BRANCH}"
          echo "上游：${UPSTREAM}  分支：${UPSTREAM_BRANCH}  ->  $(git rev-parse --short "$SRC")"

          if ! git rev-parse --verify "$SRC" >/dev/null 2>&1; then
            echo "::error::上游不存在分支 ${UPSTREAM_BRANCH}"
            exit 1
          fi

          # main 是纯镜像：直接指向上游提交。
          git push --force origin "${SRC}:refs/heads/main"
          echo "main 已对齐上游：$(git rev-parse --short "$SRC")"

      - name: Rebase dev onto main
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "dev 已包含 main，无需 rebase。"
            exit 0
          fi

          echo "dev 落后 main $(git rev-list --count HEAD..origin/main) 个提交，开始 rebase。"
          if git rebase origin/main; then
            git push --force-with-lease origin "HEAD:refs/heads/dev"
            echo "dev 已跟到：$(git rev-parse --short HEAD)"
          else
            git rebase --abort || true
            echo "::error::dev 与上游冲突，自动同步已中止。手动解一次冲突后恢复自动同步。"
            exit 1
          fi
